# src/config/settings.yaml

spark:
  app_name: "Analise Titulos Tesouro Direto"

paths:
  volume_path_bronze: "/Volumes/tesouro_transparente_pipeline/bronze/raw_data"
  silver: "`tesouro_transparente_pipeline`.`silver`"
  gold: "`tesouro_transparente_pipeline`.`gold`"

logging:
  version: 1
  disable_existing_loggers: false

  formatters:
    padrao:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"

  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: padrao
      stream: ext://sys.stdout

    file:
      class: logging.FileHandler
      level: INFO
      formatter: padrao
      filename: "tesouro-transparente-pipeline.log"

  root:
    level: INFO
    handlers: [console, file]
